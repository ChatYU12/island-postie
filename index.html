<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小岛邮差 · Island Postie</title>
<meta name="description" content="一个在浏览器里玩的小岛散步游戏：从星球降落到小岛，帮居民跑腿送信，一片片打开新的地域。">
<meta name="theme-color" content="#e7f0f2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23277d97'/%3E%3Cpath d='M9 13h22v15H9z' fill='%23fffdf8'/%3E%3Cpath d='m9 13 11 9 11-9' fill='none' stroke='%23d66d88' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="game" id="game">
  <header class="hud" id="hud" data-mode="overview">
    <div class="hud-title"><span class="logo">ISLAND POSTIE</span><span class="logo-sub">小岛邮差</span></div>
    <div class="hud-place"><span class="hud-eyebrow">现在在</span><strong id="region-name">星球</strong></div>
    <div class="hud-actions">
      <button type="button" id="to-postie">回到邮差</button>
      <button type="button" id="to-island">整座小岛</button>
      <button type="button" id="to-globe">回到星球</button>
    </div>
    <nav class="hud-regions" id="regions" aria-label="地域"></nav>
  </header>
  <main class="stage-wrap" id="stage-wrap">
    <canvas class="world-canvas" id="stage" aria-label="星球：拖动旋转，点击地域降落到小岛"></canvas>
    <div class="world-pins" id="pins"></div>
    <div class="loading" id="loading" role="status">正在搭建星球…</div>
    <div class="island-plate" aria-hidden="true"><svg class="island-compass" viewBox="0 0 64 64" focusable="false"><circle cx="32" cy="32" r="27" fill="none" stroke="#cfdadd" stroke-width="2"/><path d="M32 10 L37.5 31 L32 27.5 L26.5 31 Z" fill="#c0544f"/><path d="M32 54 L26.5 33 L32 36.5 L37.5 33 Z" fill="#b9c7c9"/><text x="32" y="8.5" text-anchor="middle" font-size="8" font-weight="700" fill="#2b4a51">N</text></svg><span class="island-plate-copy"><strong>小岛邮差</strong><span>R 旋转视角 · 滚轮缩放</span></span></div>
    <div class="island-tools"><button type="button" id="turn" aria-label="旋转小岛视角 180 度，快捷键 R">旋转视角</button></div>
    <p class="prompt" id="prompt" hidden><kbd>E</kbd> 和 <span class="prompt-name"></span> 说话</p>
    <section class="dialogue" id="dialogue" hidden aria-live="polite">
      <header><strong class="dialogue-speaker"></strong><span class="dialogue-title"></span></header>
      <p class="dialogue-text"></p>
      <button type="button">好的 <kbd>E</kbd></button>
    </section>
    <p class="keys-hint" aria-hidden="true"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 走路 · <kbd>Shift</kbd> 快跑 · <kbd>E</kbd> 说话 · <kbd>R</kbd> 旋转视角</p>
    <div class="pad" id="pad" aria-label="方向键">
      <button type="button" data-dir="up" aria-label="向上走">▲</button>
      <button type="button" data-dir="left" aria-label="向左走">◀</button>
      <button type="button" data-act="talk" aria-label="说话">E</button>
      <button type="button" data-dir="right" aria-label="向右走">▶</button>
      <button type="button" data-dir="down" aria-label="向下走">▼</button>
    </div>
    <div class="failure" id="failure" hidden>
      <strong>3D 场景没能启动</strong>
      <p>可以用兼容模式再试一次；如果仍然失败，请检查浏览器的图形加速设置。</p>
      <button type="button">以兼容模式重试</button>
      <details><summary>错误说明</summary><pre></pre></details>
    </div>
  </main>
  <p class="sr-only" id="live" role="status" aria-live="polite"></p>
</div>
<noscript><p style="padding:24px">小岛邮差需要启用 JavaScript。</p></noscript>
<script type="module" src="/src/main.js"></script>
</body>
</html>
